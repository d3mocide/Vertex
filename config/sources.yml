# Vertex source configuration — single source of truth for all data sources and feeds.
# Mount this file into containers at /config/sources.yml.
# Edit on the host to add/remove sources; the poller hot-reloads within ~5 seconds.
#
# source field:
#   config — this file is authoritative for this entry
#   user   — written here by the API when a source is added via the UI

radio_streams: []
  # - name: "P25 Tactical"
  #   url: "http://192.168.1.x:8000/radio.mp3"
  #   format: mp3        # mp3 | ogg | aac
  #   enabled: true
  #   source: config

news_feeds:
  - name: "City of Tualatin"
    url: "https://www.tualatinoregon.gov/rss/news"
    format: rss
    enabled: true
    source: config
  - name: "KOIN 6"
    url: "https://www.koin.com/feed"
    format: rss
    enabled: true
    source: config
  - name: "Portland Tribune"
    url: "https://www.portlandtribune.com/rss"
    format: rss
    enabled: true
    source: config
  - name: "OPB News"
    url: "https://www.opb.org/arc/outboundfeeds/rss/?outputType=xml"
    format: rss
    enabled: true
    source: config

poller_sources: []
  # - type: adsb         # adsb | ais | p25 | meshcore
  #   name: "Local tar1090"
