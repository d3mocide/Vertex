# Vertex source configuration — example with all fields documented.
# Copy to sources.yml and fill in your local network addresses.
#
# This file is mounted into the backend (read-write) and poller (read-only)
# containers at /config/sources.yml.
#
# The poller hot-reloads this file within ~5 seconds of any change.
# Entries added via the UI are written back here with source: user so they
# survive database wipes.
#
# source field:
#   config — managed by editing this file directly
#   user   — written here automatically when added via the UI

# ---------------------------------------------------------------------------
# Radio streams — any Icecast/HLS-compatible audio stream.
# Broadcastify feeds, local OP25 icecast, scanner feeds, etc.
# ---------------------------------------------------------------------------
radio_streams:
  - name: "Local P25"
    url: "http://192.168.1.x:8000/radio.mp3"
    format: mp3            # mp3 | ogg | aac
    enabled: true
    source: config

  - name: "Broadcastify — Portland Fire"
    url: "https://broadcastify.cdnstream1.com/XXXXX"
    format: mp3
    enabled: false
    source: config

# ---------------------------------------------------------------------------
# News feeds — RSS/Atom feeds shown in the news panel.
# ---------------------------------------------------------------------------
news_feeds:
  - name: "KOIN 6 News"
    url: "https://www.koin.com/feed"
    format: rss
    enabled: true
    source: config

  - name: "OPB News"
    url: "https://www.opb.org/arc/outboundfeeds/rss/?outputType=xml"
    format: rss
    enabled: true
    source: config

# ---------------------------------------------------------------------------
# Alert feeds — emergency agency feeds shown in the alerts panel (high priority).
# format: flashalert_xml  — FlashAlert proprietary XML (Portland-area newswire)
# format: rss             — Standard RSS from an emergency agency
# ---------------------------------------------------------------------------
alert_feeds:
  - name: "FlashAlert Emergency Newswire"
    url: "http://www.flashalertnewswire.net/IIN/reportsX/flashnews_xml_emergency.php"
    format: flashalert_xml
    enabled: true
    source: config

  - name: "TVFR Emergency Alerts"
    url: "https://www.tvfr.com/RSSFeed.aspx?ModID=63&CID=Emergency-Alert-3"
    format: rss
    enabled: true
    source: config

# ---------------------------------------------------------------------------
# Poller sources — local network endpoints for SDR and sensor data.
# The poller connects to these instead of managing its own containers.
# ---------------------------------------------------------------------------
poller_sources:
  - type: adsb             # ADS-B — tar1090 / readsb aircraft.json
    name: "Primary ADS-B"
    url: "http://192.168.1.x:8080/data/aircraft.json"
    enabled: true
    source: config

  - type: ais              # AIS — ais-catcher WebSocket
    name: "Local AIS-Catcher"
    url: "ws://192.168.1.x:10101"
    enabled: true
    source: config

  - type: p25              # P25 — OP25 HTTP terminal state endpoint
    name: "Local OP25"
    url: "http://192.168.1.x:8080"
    enabled: true
    source: config

  - type: meshcore         # MeshCore — Remote-Terminal-for-MeshCore base URL
    name: "RemoteTerm"     #   https://github.com/jkingsman/Remote-Terminal-for-MeshCore
    url: "http://192.168.1.x:8000"
    # Embed credentials if Basic Auth is enabled: http://user:pass@192.168.1.x:8000
    enabled: true
    source: config

  - type: fire             # Fire incidents — EONET open wildfires
    name: "EONET Wildfires"
    url: "https://eonet.gsfc.nasa.gov/api/v3/events?status=open&category=wildfires"
    enabled: true
    source: config

  - type: aprs             # APRS-IS feed (host:port or tcp://host:port)
    name: "APRS-IS"
    url: "rotate.aprs2.net:14580"
    enabled: true
    source: config

  - type: acars            # ACARS — ACARSHub web interface base URL
    name: "ACARSHub"       #   https://github.com/sdr-enthusiasts/docker-acarshub
    url: "http://192.168.1.x:8080"
    # Point at the ACARSHub web UI port (default 8080 on the host).
    # The poller polls /api/ every 5 s, persists messages to acars_messages,
    # and streams new arrivals to the frontend via WebSocket.
    # Messages are displayed per-aircraft in the Flight Log panel.
    enabled: false
    source: config

# ---------------------------------------------------------------------------
# MQTT sources — IoT and hardware devices that publish to the local broker.
# The Mosquitto broker starts automatically as part of the Vertex stack.
# Hardware devices should be configured to publish to this Pi's LAN IP on
# port 1883 (or the MQTT_PORT you set in .env).
#
# broker: "mosquitto"   — internal Docker service name (use for all local hardware)
#         "192.168.1.x" — LAN device running its own broker (e.g., Frigate on another Pi)
#
# normalizer: which parser handles messages on this topic
#   tinygs      — TinyGS LoRa ground station (configure node MQTT server to Pi LAN IP)
#   rtl_433     — RTL_433 SDR RF sensor decoder (rtl_433 -F "mqtt://localhost:1883,events=rtl_433/events")
#   meshtastic  — Meshtastic node JSON MQTT uplink (configure node MQTT server to Pi LAN IP)
#   ais         — AIS-catcher MQTT output (alternative to WebSocket poller_source)
#
# auth_enabled: false for local Mosquitto (no credentials needed)
#               true for external brokers — set MQTT_{UPPER_SNAKE_NAME}_USERNAME/PASSWORD in .env
#
# TinyGS note: configure your node's MQTT settings to point at this Pi's LAN IP.
# The global TinyGS REST poller (TINYGS_ENABLED) can run alongside or be disabled
# once your local node is providing data.
# ---------------------------------------------------------------------------
mqtt_sources:
  - name: "TinyGS Node"
    normalizer: tinygs
    broker: mosquitto
    port: 1883
    topic: "tinygs/#"
    qos: 0
    auth_enabled: false
    enabled: false
    source: config

  - name: "RTL_433 Sensors"
    normalizer: rtl_433
    broker: mosquitto
    port: 1883
    topic: "rtl_433/#"
    qos: 0
    auth_enabled: false
    enabled: false
    source: config

  - name: "Meshtastic"
    normalizer: meshtastic
    broker: mosquitto
    port: 1883
    topic: "msh/#"
    qos: 0
    auth_enabled: false
    enabled: false
    source: config

  - name: "AIS-Catcher MQTT"
    normalizer: ais
    broker: mosquitto
    port: 1883
    topic: "ais/#"
    qos: 0
    auth_enabled: false
    enabled: false
    source: config

# ---------------------------------------------------------------------------
# Alert zones — NWS zone codes for weather alerts.
# Find yours at: https://www.weather.gov/pimar/PubZone
# ---------------------------------------------------------------------------
alert_zones:
  nws_zones:
    - "ORZ006"             # Washington County, OR
    - "ORZ005"             # Multnomah County, OR
    - "ORZ007"             # Clackamas County, OR
  source: config

# ---------------------------------------------------------------------------
# TriMet GTFS-RT (MAX light rail, WES commuter rail, Portland Streetcar)
# is configured via .env — set TRIMET_GTFS_ENABLED=true and TRIMET_API_KEY.
# See .env.example for all available options.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Regions — define one or more geographic bounding boxes for data ingestion.
# Each region gets its own bbox filter applied to ADS-B and weather pollers.
# Pollers that support multi-region iterate over all enabled regions.
#
# If no regions are defined here, the poller falls back to the single bbox
# configured via environment variables (BBOX_MIN_LAT etc.).
# ---------------------------------------------------------------------------
regions:
  - id: "home"
    name: "Tualatin Valley"
    bbox:
      min_lat: 44.8
      max_lat: 45.9
      min_lon: -123.5
      max_lon: -121.8
    enabled: true
    show_on_map: true      # Set to false to poll data but hide the bounding box on the map

  # Example second region (disabled by default)
