bind 0.0.0.0
protected-mode no

# Memory cap — stays within Pi 5 budget
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence: light RDB snapshots, no AOF (entity state is ephemeral)
# Snapshot at most hourly. Nearly every key here is short-lived live state with a TTL that the pollers rebuild
# within a minute of a restart, and the data changes constantly, so the old "save 300 10" rewrote the whole dump
# every five minutes: about 9 GB of disk writes a day for nothing that needed keeping.
save 3600 1
appendonly no

loglevel notice
databases 1
