# Local Nominatim geocoder for Vertex — Oregon OpenStreetMap extract.
#
# Runs on any always-on machine on the LAN (it does not need to share a host
# with Vertex). Vertex reaches it via GEOCODER_URL, e.g. http://<host>:8088.
#
#   docker compose -f infra/nominatim/docker-compose.yml up -d
#   docker compose -f infra/nominatim/docker-compose.yml logs -f   # watch the import
#
# First start imports Oregon (~30-90 min depending on CPU/disk) and then keeps
# the data current from Geofabrik's daily diffs. Budget ~10 GB disk; peak RAM
# during import ~3-4 GB, ~1 GB afterwards.
services:
  nominatim:
    image: mediagis/nominatim:5.3
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      PBF_URL: https://download.geofabrik.de/north-america/us/oregon-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/north-america/us/oregon-updates/
      REPLICATION_UPDATE_INTERVAL: "86400"
      REPLICATION_RECHECK_INTERVAL: "900"
      UPDATE_MODE: continuous
      # "address" keeps streets and house numbers (all Vertex needs) and skips
      # POI detail, which roughly halves import time and disk.
      IMPORT_STYLE: address
      IMPORT_WIKIPEDIA: "false"
      THREADS: "4"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-vertex-nominatim}
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1gb

volumes:
  nominatim-data:
