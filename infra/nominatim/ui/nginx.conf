server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The Nominatim API; the UI calls these paths on its own origin.
    location ~ ^/(search|reverse|lookup|details|status|deletable|polygons)(\.php)?$ {
        proxy_pass http://nominatim:8080;
        proxy_set_header Host $host;
    }
}
