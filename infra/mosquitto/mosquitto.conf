# Vertex local MQTT broker — IoT hardware ingress bus
# Accepts connections from LAN hardware devices (TinyGS nodes, RTL_433, etc.)
# and from the poller container via internal Docker networking.
# The broker is opt-in and requires credentials supplied by Docker Compose.
# Bind the published port deliberately with MQTT_BIND_ADDRESS.

listener 1883
allow_anonymous false
password_file /tmp/mosquitto.passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

message_size_limit 1048576
max_queued_messages 1000
max_queued_bytes 10485760
