# Vertex local MQTT broker — IoT hardware ingress bus
# Accepts connections from LAN hardware devices (TinyGS nodes, RTL_433, etc.)
# and from the poller container via internal Docker networking.
# No TLS, no authentication — intended for local network use only.
# Do NOT expose port 1883 beyond your LAN.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
