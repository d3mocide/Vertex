# Region pack template. Copy this directory to regions/<your-area>/ and edit.
# The directory name must equal `id`. Directories starting with "_" are ignored by the setup wizard.
#
# Validate your pack:  python3 backend/packs.py regions   (or run the backend tests)
schema: 1
id: your-area                 # lowercase letters, digits, dashes
name: Your Area
description: One sentence on what this pack adds.
maintainers: [your-github-handle]

covers:                       # used to suggest this pack for a location (either or both)
  states: [XX]                # two-letter US state codes
  bbox: [-100.0, 30.0, -90.0, 40.0]   # min_lon, min_lat, max_lon, max_lat

requires_keys:                # keys the operator must add to .env; values never go in a pack
  - name: EXAMPLE_API_KEY
    where: https://example.invalid/get-a-key
    free: true
    unlocks: [traffic.incidents]

feeds:                        # optional: added to sources.yml when the operator picks this pack
  news:
    - name: Example Local News
      url: https://example.invalid/rss
      format: rss                 # rss
  alerts:
    - name: County Emergency Management
      url: https://example.invalid/alerts.rss
      format: rss                 # rss | flashalert_xml

providers:
  - id: example-provider
    kind: builtin             # code in the repo; "arcgis_featureserver" below needs no code
    provides: [traffic.incidents]   # contract ids from docs/contracts/

  # A provider described entirely here, with no Python: fire danger from an ArcGIS layer. See
  # docs/architecture/region-pack-authoring.md for every field. Remove this example if you do not need it.
  - id: example-fire-danger
    kind: arcgis_featureserver
    provides: [fire.danger]
    url: https://gis.example.invalid/arcgis/rest/services/Fire/FeatureServer/0   # https; the layer, without /query
    attribution: Example Forestry     # shown beside the data
    refresh_minutes: 30
    fields:
      id: OBJECTID
      zone: [ZONE_NAME, DISTRICT]     # a name or a list; the first one with a value is used
      level: DANGER_LEVEL
    levels:                           # the agency's wording (or codes) -> danger 1-4 (map colour), optional rank 1-5 and label
      low:     {danger: 1}
      high:    {danger: 3}
      extreme: {danger: 4, rank: 5}
    extra: {burn_ban: BAN_STATUS}     # optional: extra detail kept on each zone (output name -> service field)
    scope: Applies to state-protected land only   # optional: shown with any burn_ban
    skip_unknown: false               # true drops zones whose level is not listed (otherwise they show as not rated)
