schema: 1
id: washington
name: Washington
description: Road alerts and traffic-camera snapshots from the WSDOT Traveler API, work zones from WSDOT's open WZDx feed, plus DNR fire danger and burn restrictions, including southwest Washington for Columbia River border regions.
maintainers: [d3mocide]
covers:
  states: [WA]
  bbox: [-124.8, 45.5, -116.9, 49.1]
requires_keys:
  - name: SOUNDTRANSIT_API_KEY
    where: https://www.soundtransit.org/help-contacts/business-information/open-transit-data-otd/otd-downloads
    free: true
    unlocks: [transit.routes, transit.vehicles]
  - name: WSDOT_API_KEY
    where: https://www.wsdot.wa.gov/traffic/api/
    free: true
    unlocks: [traffic.incidents, traffic.cameras]
defaults:
  geocoder_state: Washington
feeds:
  alerts:
    - name: FlashAlert Emergency Newswire
      url: http://www.flashalertnewswire.net/IIN/reportsX/flashnews_xml_emergency.php
      format: flashalert_xml
providers:
  - id: wsdot-travel
    kind: builtin
    provides: [traffic.incidents, traffic.cameras]
  - id: wsdot-workzones               # the state's open work-zone feed: no key, planned work only
    kind: wzdx
    provides: [traffic.incidents]
    url: https://wzdx.wsdot.wa.gov/api/v4/WorkZoneFeed
    attribution: WSDOT
    link: https://wsdot.com/travel/real-time/map/
  - id: wadnr-fire-danger
    kind: arcgis_featureserver
    provides: [fire.danger]
    url: https://gis.dnr.wa.gov/site3/rest/services/Public_Wildfire/WADNR_PUBLIC_WD_WildfireDanger/MapServer/0
    attribution: WA DNR
    refresh_minutes: 30
    fields:
      id: OBJECTID
      zone: [FIREDANGER_AREA_NM, DNR_REGION_NAME]    # first one that has a value
      level: FIRE_DANGER_LEVEL_NM
    levels:                          # the map shows four colours; rank keeps the agency's five levels apart
      low:       {danger: 1, rank: 1}
      moderate:  {danger: 2, rank: 2}
      high:      {danger: 3, rank: 3}
      very high: {danger: 4, rank: 4}
      extreme:   {danger: 4, rank: 5}
    extra:                           # extra detail kept on each zone: output name -> service field
      district_name: DNR_REGION_NAME
      burn_ban: BURN_BAN_LEVEL_NM
      burn_ban_code: BURN_BAN_LEVEL_CD
      notes: NOTES_TXT
    scope: DNR-protected forestlands; local restrictions may also apply
  - id: ctran-transit
    kind: builtin
    provides: [transit.routes]
  - id: soundtransit-transit
    kind: gtfs_rt
    provides: [transit.routes, transit.vehicles]
    attribution: Sound Transit
    static_url: https://www.soundtransit.org/GTFS-rail/40_gtfs.zip
    realtime_url: https://api.pugetsound.onebusaway.org/api/gtfs_realtime/vehicle-positions-for-agency/40.pb
    key: {env: SOUNDTRANSIT_API_KEY, param: key}   # must also be listed under requires_keys
    coverage: [-123.2, 46.8, -121.3, 48.3]         # Puget Sound
