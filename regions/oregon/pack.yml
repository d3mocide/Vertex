# Oregon region pack — the data Vertex was built around.
# Providers are built into Vertex today (kind: builtin); they move behind the provider interface
# in a later phase without changing what this file says.
schema: 1
id: oregon
name: Oregon
description: Road conditions, cameras, message signs and road weather from ODOT TripCheck, power outages from Oregon's ODIN feed, and ODF fire danger.
maintainers: [d3mocide]

covers:
  states: [OR]
  bbox: [-124.7, 41.9, -116.4, 46.3]   # min_lon, min_lat, max_lon, max_lat

requires_keys:
  - name: TRIMET_APP_ID
    where: https://developer.trimet.org/
    free: true
    unlocks: [transit.routes, transit.vehicles]
  - name: ODOT_API_KEY
    where: https://developer.odot.state.or.us
    free: true
    unlocks: [traffic.incidents, traffic.cameras, traffic.signs, traffic.corridors, roadwx.stations]

defaults:
  geocoder_state: Oregon

# Local news and emergency feeds added to sources.yml when the operator picks this pack.
feeds:
  news:
    - name: KOIN 6 News
      url: https://www.koin.com/feed
      format: rss
    - name: OPB News
      url: https://www.opb.org/arc/outboundfeeds/rss/?outputType=xml
      format: rss
  alerts:
    - name: FlashAlert Emergency Newswire
      url: http://www.flashalertnewswire.net/IIN/reportsX/flashnews_xml_emergency.php
      format: flashalert_xml
    - name: TVF&R Emergency Alerts
      url: https://www.tvfr.com/RSSFeed.aspx?ModID=63&CID=Emergency-Alert-3
      format: rss

providers:
  - id: odot-tripcheck
    kind: builtin
    provides: [traffic.incidents, traffic.cameras, traffic.signs, traffic.corridors, roadwx.stations]
  - id: oregon-odin
    kind: builtin
    provides: [outages.areas]
  - id: odf-fire-danger
    kind: builtin
    provides: [fire.danger]
  - id: trimet-transit
    kind: builtin
    provides: [transit.routes, transit.vehicles]
  - id: cherriots-transit
    kind: builtin
    provides: [transit.routes]
