services:

  # ── Persistence ─────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
        reservations:
          memory: 256m
          cpus: '0.5'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vertex}
      POSTGRES_USER: ${POSTGRES_USER:-vertex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vertex}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vertex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 64m
          cpus: '0.1'
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ── MQTT Broker ──────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
        reservations:
          memory: 16m
          cpus: '0.05'
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t 'health/check' -m 'ok' -q 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Application ──────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
        reservations:
          memory: 128m
          cpus: '0.25'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file: ${VERTEX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vertex}:${POSTGRES_PASSWORD:-vertex}@db:5432/${POSTGRES_DB:-vertex}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - internal
    volumes:
      - ./backend:/app:ro
      - ./config:/config  # read-write: write-back API persists UI changes to sources.yml
      - p25_audio:/data/audio

  poller:
    build:
      context: ./poller
      args:
        AIRCRAFT_DB_URL: ${AIRCRAFT_DB_URL:-https://raw.githubusercontent.com/wiedehopf/tar1090-db/refs/heads/csv/aircraft.csv.gz}
        AIRPORTS_DB_URL: ${AIRPORTS_DB_URL:-https://davidmegginson.github.io/ourairports-data/airports.csv}
        AIRLINES_DB_URL: ${AIRLINES_DB_URL:-https://raw.githubusercontent.com/jpatokal/openflights/master/data/airlines.dat}
        NAVAIDS_DB_URL: ${NAVAIDS_DB_URL:-https://davidmegginson.github.io/ourairports-data/navaids.csv}
        DATA_CACHEBUST: ${DATA_CACHEBUST:-static}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: '1.0'
        reservations:
          memory: 128m
          cpus: '0.25'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file: ${VERTEX_ENV_FILE:-.env}
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vertex}:${POSTGRES_PASSWORD:-vertex}@db:5432/${POSTGRES_DB:-vertex}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ./poller:/app:ro
      - ./config:/config:ro  # read-only: config watcher detects changes via mtime
      - p25_audio:/data/audio

  frontend:
    build:
      context: ./frontend
      args:
        VITE_REGION_LAT: ${REGION_LAT:-45.3842}
        VITE_REGION_LON: ${REGION_LON:--122.7635}
        VITE_RADAR_LAYER: ${VITE_RADAR_LAYER:-RTX-N0B-0}
        VITE_RADAR_FALLBACK_LAYER: ${VITE_RADAR_FALLBACK_LAYER:-radar}
        VITE_RADAR_FALLBACK_MAX_ZOOM: ${VITE_RADAR_FALLBACK_MAX_ZOOM:-6}
        VITE_OBSERVATION_RANGE_KM: ${VITE_OBSERVATION_RANGE_KM:-50}
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_PRESERVE_DRAWING_BUFFER: ${VITE_PRESERVE_DRAWING_BUFFER:-false}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ── Whisper P25 Transcription ───────────────────────
  transcription:
    build:
      context: ./transcription
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 512m
          cpus: '0.5'
    env_file: ${VERTEX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vertex}:${POSTGRES_PASSWORD:-vertex}@db:5432/${POSTGRES_DB:-vertex}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - p25_audio:/data/audio          # shared audio dir for P25 call recordings
      - whisper_models:/root/.cache    # persist downloaded model weights across restarts
    networks:
      - internal

  # ── Offline Tile Server ──────────────────────────────
  # Enable with: docker compose --profile offline up -d
  # Requires mbtiles file(s) in ./tiles/ (e.g. planet.mbtiles from OpenMapTiles)
  # Set VITE_TILE_URL=http://localhost:8080/styles/basic-preview/style.json
  # in .env to point the frontend at this server.
  tileserver:
    image: maptiler/tileserver-gl:latest
    profiles: ["offline"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    volumes:
      - ./tiles:/data:ro
    ports:
      - "${TILESERVER_PORT:-8080}:8080"
    command: ["--config", "/data/config.json"]
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  redis_data:
  mosquitto_data:  # MQTT broker persistence (retained messages, subscriptions)
  p25_audio:       # P25 call recordings; shared with transcription service
  whisper_models:  # Whisper model weights cache; avoids re-downloading on container restart
