services:

  # ── Persistence ─────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
        reservations:
          memory: 256m
          cpus: '0.5'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vertex}
      POSTGRES_USER: ${POSTGRES_USER:-vertex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vertex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 64m
          cpus: '0.1'
    command: >-
      sh -ec 'exec redis-server /etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ── MQTT Broker ──────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    profiles: ["mqtt"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
        reservations:
          memory: 16m
          cpus: '0.05'
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    command: >-
      sh -ec ': "$${MQTT_USERNAME:?Set MQTT_USERNAME}"; : "$${MQTT_PASSWORD:?Set MQTT_PASSWORD}"; mosquitto_passwd -b -c /tmp/mosquitto.passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
      && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u $$MQTT_USERNAME -P $$MQTT_PASSWORD -t 'health/check' -m 'ok' -q 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Application ──────────────────────────────────
  backend:
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    build:
      context: ./backend
    restart: unless-stopped
    # Public resolvers: the host's DHCP-provided DNS was unreadable at container start once, leaving
    # these containers with no external name resolution (AIS/OpenSky/etc. all failed). Service names
    # (redis, db) still resolve through Docker's embedded resolver.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
        reservations:
          memory: 128m
          cpus: '0.25'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file: ${VERTEX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vertex}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vertex}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - internal
    volumes:
      - ./backend:/app:ro
      - ./config:/config  # read-write: write-back API persists UI changes to sources.yml
      - ./regions:/regions:ro  # region packs offered by the setup wizard
      - p25_audio:/data/audio

  poller:
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    build:
      context: ./poller
      args:
        AIRCRAFT_DB_URL: ${AIRCRAFT_DB_URL:-https://raw.githubusercontent.com/wiedehopf/tar1090-db/655afe27950658a4124d15d75766538b1ae9ea3b/aircraft.csv.gz}
        AIRPORTS_DB_URL: ${AIRPORTS_DB_URL:-https://raw.githubusercontent.com/davidmegginson/ourairports-data/f31ef57d6e9b67764b3c2ec2336a10bcaa4e28b6/airports.csv}
        AIRLINES_DB_URL: ${AIRLINES_DB_URL:-https://raw.githubusercontent.com/jpatokal/openflights/7d1a611e070295dba776d6afb86e57d0d1aa1cef/data/airlines.dat}
        NAVAIDS_DB_URL: ${NAVAIDS_DB_URL:-https://raw.githubusercontent.com/davidmegginson/ourairports-data/f31ef57d6e9b67764b3c2ec2336a10bcaa4e28b6/navaids.csv}
        DATA_CACHEBUST: ${DATA_CACHEBUST:-static}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: '1.0'
        reservations:
          memory: 128m
          cpus: '0.25'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file: ${VERTEX_ENV_FILE:-.env}
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vertex}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vertex}
      # Cap glibc malloc arenas: with many threads, each arena retains freed
      # memory. (The poller also trims its heap every 5 minutes; see main.py.)
      MALLOC_ARENA_MAX: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
        required: false
    # Public resolvers: the host's DHCP-provided DNS was unreadable at container start once, leaving
    # these containers with no external name resolution (AIS/OpenSky/etc. all failed). Service names
    # (redis, db) still resolve through Docker's embedded resolver.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - internal
    volumes:
      - ./poller:/app:ro
      - ./config:/config:ro  # read-only: config watcher detects changes via mtime
      - p25_audio:/data/audio

  frontend:
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    build:
      context: ./frontend
      args:
        VITE_RADAR_LAYER: ${VITE_RADAR_LAYER:-RTX-N0B-0}
        VITE_RADAR_FALLBACK_LAYER: ${VITE_RADAR_FALLBACK_LAYER:-radar}
        VITE_RADAR_FALLBACK_MAX_ZOOM: ${VITE_RADAR_FALLBACK_MAX_ZOOM:-6}
        VITE_OBSERVATION_RANGE_KM: ${VITE_OBSERVATION_RANGE_KM:-50}
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_PRESERVE_DRAWING_BUFFER: ${VITE_PRESERVE_DRAWING_BUFFER:-false}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ── Whisper P25 Transcription ───────────────────────
  transcription:
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    build:
      context: ./transcription
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          # Transcription is a background task — never let it saturate the
          # host (map/API responsiveness comes first on 2-core deployments).
          cpus: '1.0'
        reservations:
          memory: 512m
          cpus: '0.5'
    env_file: ${VERTEX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vertex}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vertex}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - p25_audio:/data/audio          # shared audio dir for P25 call recordings
      - whisper_models:/models    # persist downloaded model weights across restarts
    networks:
      - internal

  # ── Offline Tile Server ──────────────────────────────
  # Enable with: docker compose --profile offline up -d
  # Requires mbtiles file(s) in ./tiles/ (e.g. planet.mbtiles from OpenMapTiles)
  # Set VITE_TILE_URL=http://localhost:8080/styles/basic-preview/style.json
  # in .env to point the frontend at this server.
  tileserver:
    image: maptiler/tileserver-gl:v5.3.1@sha256:99841aa659ba7d49168a19dfc56ae37af79b6d9f52d46d16ba42cddc8c088771
    profiles: ["offline"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    volumes:
      - ./tiles:/data:ro
    ports:
      - "${TILESERVER_BIND_ADDRESS:-127.0.0.1}:${TILESERVER_PORT:-8080}:8080"
    command: ["--config", "/data/config.json"]
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  redis_data:
  mosquitto_data:  # MQTT broker persistence (retained messages, subscriptions)
  p25_audio:       # P25 call recordings; shared with transcription service
  whisper_models:  # Whisper model weights cache; avoids re-downloading on container restart
