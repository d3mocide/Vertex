name: Images

# Builds the four Vertex images for linux/amd64 and linux/arm64 and publishes them to GHCR:
#   ghcr.io/<owner>/vertex-{backend,poller,frontend,transcription}
# (the radio service runs the poller image). Each platform builds natively on its own runner, then one
# multi-platform tag is assembled from the two digests, and the result is scanned with Trivy.
#
# Tags: sha-<short commit> on every build, latest for main, and <version>/<major>.<minor> for v* tags.
# Main only publishes after the Tests workflow passed for that exact commit. Production pins a sha- tag
# (VERTEX_IMAGE_TAG in .env), so what runs is always a known commit; the image's
# org.opencontainers.image.revision label records it too.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

env:
  # The commit being published: the tested commit for workflow_run (github.sha is main's head there), else the ref.
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    # Tests must have passed on a push to main; tag pushes and manual runs build directly.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, poller, frontend, transcription]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vertex-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=vertex-${{ matrix.service }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }},mode=max

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, poller, frontend, transcription]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Image name and short commit
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vertex-${{ matrix.service }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SOURCE_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ env.SHORT_SHA }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Summary
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-$SHORT_SHA"
          {
            echo "### vertex-${{ matrix.service }}"
            echo
            jq -r '.tags[] | "- `" + . + "`"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan ${{ matrix.service }}
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, poller, frontend, transcription]
    steps:
      - name: Image reference
        run: echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vertex-${{ matrix.service }}:sha-${SOURCE_SHA::7}" >> "$GITHUB_ENV"

      # Every finding goes to the repository's code-scanning alerts (Security tab), one category per image.
      # The scan reports, it does not block: lockfile audits in the Tests workflow are the gate for our own
      # dependencies, and base-image findings are fixed by Dependabot's digest bumps.
      - name: Trivy (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: image-${{ matrix.service }}

      - name: Trivy (fixable HIGH and CRITICAL, in the log)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.76.1
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
