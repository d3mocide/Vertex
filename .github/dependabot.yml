version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # React 19 needs a coordinated ReactDOM and application migration.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 moves the PostCSS plugin to @tailwindcss/postcss and needs
      # a coordinated configuration and stylesheet migration.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directories:
      - /backend
      - /poller
      - /transcription
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # bcrypt 5 rejects passwords over 72 bytes and is incompatible with
      # Passlib 1.7.4. Revisit with a coordinated password-hashing migration.
      - dependency-name: bcrypt
        update-types: ["version-update:semver-major"]
      # Vertex's BEAST decoder intentionally uses the pyModeS 2.x API. The
      # 3.x API is incompatible and causes the decoder coverage to be skipped.
      - dependency-name: pymodes
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend-images:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Stay on the pinned LTS Node line; review major build-runtime changes manually.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
