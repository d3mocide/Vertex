server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so optional upstreams are resolved at request
    # time rather than at startup — prevents crash when SDR profile is inactive.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # REST API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Icecast P25 audio stream (sdr profile only — gracefully 502 when offline)
    location /stream/ {
        set $icecast_upstream http://icecast:8000;
        proxy_pass $icecast_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # OP25 web terminal (optional — admin use only)
    location /op25/ {
        set $op25_upstream http://op25:8080;
        proxy_pass $op25_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
