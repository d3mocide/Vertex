<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERTEX — Situational Awareness</title>
  <meta name="description" content="Real-time situational awareness dashboard for local public safety, environment, and infrastructure." />

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Material Symbols icon font -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Favicon — Vertex Scope mark (Direction 07, adopted 2026-05-01) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='none' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='square'><path d='M2 8 V2 H8'/><path d='M24 2 H30 V8'/><path d='M30 24 V30 H24'/><path d='M8 30 H2 V24'/></g><polygon points='16,7 25,16 16,25 7,16' fill='none' stroke='%23ffffff' stroke-width='2'/><rect x='14' y='14' width='4' height='4' fill='%23FFB800'/></svg>">
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FFB800" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VERTEX" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <!-- Loading Screen Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0a0a0f;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vertex-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .vertex-mark {
      width: 120px;
      height: 120px;
      position: relative;
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .vertex-mark svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(255, 184, 0, 0.3));
    }

    .loader-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .loader-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }

    .loader-subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: #FFB800;
      font-family: 'Roboto Mono', monospace;
      text-transform: uppercase;
    }

    .loader-status {
      font-size: 12px;
      color: #888888;
      font-family: 'Roboto Mono', monospace;
      margin-top: 2rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Hide loader when React mounts */
    .vertex-loader.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="vertex-loader" id="loader">
      <div class="vertex-mark">
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>
          <g fill='none' stroke='#ffffff' stroke-width='1.5' stroke-linecap='square'>
            <path d='M2 8 V2 H8'/>
            <path d='M24 2 H30 V8'/>
            <path d='M30 24 V30 H24'/>
            <path d='M8 30 H2 V24'/>
          </g>
          <polygon points='16,7 25,16 16,25 7,16' fill='none' stroke='#ffffff' stroke-width='2'/>
          <rect x='14' y='14' width='4' height='4' fill='#FFB800'/>
        </svg>
      </div>
      <div class="loader-text">
        <div class="loader-title">VERTEX</div>
        <div class="loader-subtitle">Situational Awareness</div>
      </div>
      <div class="loader-status">Initializing…</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Hide loader when React mounts
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader')
      if (loader) {
        setTimeout(() => {
          loader.classList.add('hidden')
        }, 500)
      }
    })
  </script>
</body>
</html>
