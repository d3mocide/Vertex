<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover → content extends under the notch / home indicator (enables env(safe-area-inset-*)).
       maximum-scale=1 + user-scalable=no → lock out iOS pinch-zoom and the auto-zoom on input focus. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>VERTEX — Situational Awareness</title>
  <meta name="description" content="Real-time situational awareness dashboard for local public safety, environment, and infrastructure." />


  <!-- Favicon — Vertex Scope mark (Direction 07, adopted 2026-05-01) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='none' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='square'><path d='M2 8 V2 H8'/><path d='M24 2 H30 V8'/><path d='M30 24 V30 H24'/><path d='M8 30 H2 V24'/></g><polygon points='16,7 25,16 16,25 7,16' fill='none' stroke='%23ffffff' stroke-width='2'/><rect x='14' y='14' width='4' height='4' fill='%23FFB800'/></svg>">
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FFB800" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VERTEX" />
  <!-- iOS ignores SVG home-screen icons and auto-generates a tile from the app
       name + theme color (the gold "V"). A real 180×180 PNG restores the
       Scope-mark branding on the home screen and standalone splash. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Loading Screen Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0a0a0f;
      color: #ffffff;
      font-family: 'Inter', system-ui, sans-serif;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vertex-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .vertex-mark {
      width: 120px;
      height: 120px;
      position: relative;
    }

    /* ACQUIRE Animation Components */
    @keyframes acq-tl { 0%{transform:translate(-12px,-12px);opacity:0} 40%{transform:translate(-12px,-12px);opacity:1} 70%,100%{transform:translate(0,0);opacity:1} }
    @keyframes acq-tr { 0%{transform:translate(12px,-12px);opacity:0} 40%{transform:translate(12px,-12px);opacity:1} 70%,100%{transform:translate(0,0);opacity:1} }
    @keyframes acq-bl { 0%{transform:translate(-12px,12px);opacity:0} 40%{transform:translate(-12px,12px);opacity:1} 70%,100%{transform:translate(0,0);opacity:1} }
    @keyframes acq-br { 0%{transform:translate(12px,12px);opacity:0} 40%{transform:translate(12px,12px);opacity:1} 70%,100%{transform:translate(0,0);opacity:1} }
    @keyframes acq-diamond { 0%,40%{opacity:0;transform:scale(1.2)} 75%{opacity:1;transform:scale(1)} 100%{opacity:1;transform:scale(1)} }
    @keyframes acq-pip { 0%,75%{opacity:0;transform:scale(0.4)} 90%,100%{opacity:1;transform:scale(1)} }

    /* Secondary Rotation for Inner Diamond */
    @keyframes spin-inner {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .a-brk { transform-origin: center; animation: none 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .a-brk.tl { animation-name: acq-tl; }
    .a-brk.tr { animation-name: acq-tr; }
    .a-brk.bl { animation-name: acq-bl; }
    .a-brk.br { animation-name: acq-br; }

    .a-outer {
      transform-origin: 16px 16px;
      animation: acq-diamond 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, spin-inner 3s linear infinite 1.5s;
    }

    .a-inner {
      transform-origin: 16px 16px;
      animation: acq-pip 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .vertex-mark svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(255, 184, 0, 0.3));
    }

    .loader-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .loader-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .loader-subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: #FFB800;
      font-family: 'Roboto Mono', 'Courier New', monospace;
      text-transform: uppercase;
    }

    .loader-status {
      font-size: 12px;
      color: #888888;
      font-family: 'Roboto Mono', 'Courier New', monospace;
      margin-top: 2rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Hide loader when React mounts */
    .vertex-loader.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="vertex-loader" id="loader">
      <div class="vertex-mark">
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>
          <g fill='none' stroke='#ffffff' stroke-width='1.5' stroke-linecap='square'>
            <path class="a-brk tl" d='M2 8 V2 H8'/>
            <path class="a-brk tr" d='M24 2 H30 V8'/>
            <path class="a-brk br" d='M30 24 V30 H24'/>
            <path class="a-brk bl" d='M8 30 H2 V24'/>
          </g>
          <polygon class="a-outer" points='16,7 25,16 16,25 7,16' fill='none' stroke='#ffffff' stroke-width='2'/>
          <rect class="a-inner" x='14' y='14' width='4' height='4' fill='#FFB800'/>
        </svg>
      </div>
      <div class="loader-text">
        <div class="loader-title">VERTEX</div>
        <div class="loader-subtitle">Situational Awareness</div>
      </div>
      <div class="loader-status">Initializing…</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Hide loader when React mounts
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader')
      if (loader) {
        setTimeout(() => {
          loader.classList.add('hidden')
        }, 500)
      }
    })
  </script>
</body>
</html>
