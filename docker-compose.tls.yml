# TLS overlay — override the frontend service to terminate HTTPS at Nginx.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Before first run:
#   mkdir -p certs
#   # Self-signed (LAN / testing):
#   openssl req -x509 -newkey rsa:4096 -keyout certs/key.pem -out certs/cert.pem \
#           -days 365 -nodes -subj "/CN=vertex"
#   # Production: replace certs/cert.pem + certs/key.pem with Let's Encrypt certs.
#
# Set TLS_CERT_PATH / TLS_KEY_PATH in .env if your cert files live elsewhere.

services:
  frontend:
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./frontend/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:-./certs/cert.pem}:/etc/nginx/certs/cert.pem:ro
      - ${TLS_KEY_PATH:-./certs/key.pem}:/etc/nginx/certs/key.pem:ro
