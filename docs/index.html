<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VERTEX // DOCUMENTATION</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<!-- marked 12.0.2 (vendored so the docs work offline / on a private network) -->
<script src="assets/marked.min.js"></script>

<style>
/* ── Design tokens ───────────────────────────────────────────────────────── */
:root {
  --onyx-black: #050505;
  --onyx-deep:  #0a0a0a;
  --surface:    #0f0f0f;
  --surface-hi: #141414;
  --surface-hhi: #1a1a1a;
  --amber:      #FFB800;
  --amber-dim:  #B88600;
  --on-surface: #F2F2F2;
  --on-variant: #8C8C8C;
  --outline:    #333333;
  --violet:     #B388FF;
  --red:        #FF453A;
  --green:      #30D158;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--onyx-black);
  color: var(--on-surface);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.shell {
  display: grid;
  grid-template-rows: 52px 1fr;
  grid-template-columns: 220px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ── Topbar ──────────────────────────────────────────────────────────────── */
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  background: var(--onyx-deep);
  border-bottom: 1px solid var(--outline);
  position: relative;
}
.topbar::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--amber) 20%, var(--amber) 80%, transparent);
  opacity: 0.4;
}
.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.brand-mark svg { flex-shrink: 0; }
.brand-word {
  font-weight: 900;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--amber);
}
.brand-sep {
  color: var(--outline);
  font-size: 18px;
  margin: 0 4px;
}
.brand-sub {
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--on-variant);
}
.topbar-right {
  margin-left: auto;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--on-variant);
}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.sidebar {
  background: var(--onyx-black);
  border-right: 1px solid var(--outline);
  overflow-y: auto;
  padding: 12px 0;
}
.nav-section-label {
  padding: 10px 16px 4px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--on-variant);
  opacity: 0.6;
}
.nav-item {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-right: 2px solid transparent;
  padding: 7px 16px;
  font-size: 11px;
  font-family: inherit;
  color: var(--on-variant);
  cursor: pointer;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--on-surface); }
.nav-item.active {
  color: var(--amber);
  background: rgba(255, 184, 0, 0.08);
  border-right-color: var(--amber);
}

/* ── Content ─────────────────────────────────────────────────────────────── */
.content {
  overflow-y: auto;
  padding: 40px 56px;
  max-width: 860px;
}

/* ── Markdown prose ──────────────────────────────────────────────────────── */
.prose h1 {
  font-size: 13px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--amber);
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--outline);
}
.prose h2 {
  font-size: 12px;
  font-weight: 700;
  color: var(--on-surface);
  margin-top: 32px;
  margin-bottom: 10px;
}
.prose h3 {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--on-variant);
  margin-top: 20px;
  margin-bottom: 6px;
}
.prose p {
  color: var(--on-variant);
  font-size: 12px;
  margin-bottom: 12px;
  line-height: 1.7;
}
.prose ul, .prose ol {
  padding-left: 20px;
  margin-bottom: 12px;
}
.prose li {
  color: var(--on-variant);
  font-size: 12px;
  margin-bottom: 4px;
  line-height: 1.6;
}
.prose li strong, .prose p strong { color: var(--on-surface); }
.prose a { color: var(--amber); text-decoration: none; }
.prose a:hover { text-decoration: underline; }
.prose code {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  color: var(--amber);
  background: rgba(255,255,255,0.06);
  padding: 1px 5px;
  border-radius: 3px;
}
.prose pre {
  background: var(--onyx-deep);
  border: 1px solid var(--outline);
  border-radius: 4px;
  padding: 16px;
  overflow-x: auto;
  margin-bottom: 16px;
}
.prose pre code {
  background: none;
  padding: 0;
  color: var(--on-surface);
  font-size: 11px;
  line-height: 1.6;
}
.prose table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin-bottom: 16px;
}
.prose thead { border-bottom: 1px solid var(--outline); }
.prose th {
  text-align: left;
  padding: 6px 12px;
  font-weight: 700;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--on-surface);
  background: rgba(255,255,255,0.03);
}
.prose td {
  padding: 6px 12px;
  color: var(--on-variant);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.prose tr:last-child td { border-bottom: none; }
.prose td code { font-size: 10px; }
.prose blockquote {
  border-left: 2px solid var(--amber);
  padding-left: 14px;
  margin: 16px 0;
  color: var(--on-variant);
  font-style: italic;
}

/* ── Scrollbar ───────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--on-variant); }

/* ── Mobile ──────────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: 52px auto 1fr; }
  .sidebar { max-height: 180px; border-right: none; border-bottom: 1px solid var(--outline); }
  .content { padding: 24px 20px; }
}
</style>
</head>
<body>

<div class="shell">
  <!-- Topbar -->
  <header class="topbar">
    <div class="brand-mark">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <g fill="none" stroke="#FFB800" stroke-width="1.5" stroke-linecap="square">
          <path d="M2 8 V2 H8"/><path d="M24 2 H30 V8"/>
          <path d="M30 24 V30 H24"/><path d="M8 30 H2 V24"/>
        </g>
        <polygon points="16,7 25,16 16,25 7,16" fill="none" stroke="#FFB800" stroke-width="2"/>
        <rect x="14" y="14" width="4" height="4" fill="#FFB800"/>
      </svg>
      <span class="brand-word">VERTEX</span>
    </div>
    <span class="brand-sep">/</span>
    <span class="brand-sub">Documentation</span>
    <div class="topbar-right">Local-first situational awareness</div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar" aria-label="Documentation navigation"></nav>

  <!-- Content -->
  <main class="content prose" id="content" role="main"></main>
</div>

<script>
// Pages are loaded from the Markdown files in this directory, so the docs stay in one place.
// Add a page by adding a line here (path is relative to this file).
const SECTIONS = ['Guides', 'Product', 'System Design', 'Configuration']

const DOCS = [
  { id: "getting-started", title: "Getting Started", section: "Guides", path: "getting-started.md" },
  { id: "features-overview", title: "Feature Overview", section: "Product", path: "features/overview.md" },
  { id: "map-key", title: "Map Key", section: "Product", path: "map-key.md" },
  { id: "architecture-overview", title: "Architecture Overview", section: "System Design", path: "architecture/overview.md" },
  { id: "region-packs", title: "Region Packs (Design)", section: "System Design", path: "architecture/region-packs.md" },
  { id: "map-layers", title: "Map Layer Architecture", section: "System Design", path: "architecture/map-layers.md" },
  { id: "feed-contracts", title: "Feed Contracts", section: "System Design", path: "contracts/README.md" },
  { id: "env-configuration", title: "Environment Configuration", section: "Configuration", path: "configuration/environment.md" },
  { id: "sources-configuration", title: "Source Configuration", section: "Configuration", path: "configuration/sources.md" },
  { id: "poller-filtering", title: "Poller Filtering Rules", section: "Configuration", path: "configuration/poller-filtering.md" },
  { id: "security-review", title: "Security Review & Upgrade Checklist", section: "Configuration", path: "reviews/security-2026-09-29.md" }
]

let activeId = null

function buildSidebar() {
  const sidebar = document.getElementById('sidebar')
  sidebar.innerHTML = ''
  SECTIONS.forEach(section => {
    const pages = DOCS.filter(d => d.section === section)
    if (!pages.length) return
    const label = document.createElement('div')
    label.className = 'nav-section-label'
    label.textContent = section
    sidebar.appendChild(label)
    pages.forEach(doc => {
      const btn = document.createElement('button')
      btn.className = 'nav-item' + (doc.id === activeId ? ' active' : '')
      btn.textContent = doc.title
      btn.dataset.id = doc.id
      btn.addEventListener('click', () => navigate(doc.id))
      sidebar.appendChild(btn)
    })
  })
}

function resolve(path, base) {
  return new URL(path, new URL(base, location.href)).pathname
}

// Point relative images at the right place and turn links between docs into in-app navigation.
function fixLinks(root, doc) {
  const docUrl = new URL(doc.path, location.href)
  root.querySelectorAll('img[src]').forEach(img => {
    const src = img.getAttribute('src')
    if (!/^(https?:|data:|\/)/.test(src)) img.setAttribute('src', new URL(src, docUrl).href)
  })
  root.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href')
    if (/^(https?:|mailto:|#)/.test(href)) { if (/^https?:/.test(href)) a.target = '_blank'; return }
    const [file, hash] = href.split('#')
    const target = DOCS.find(d => resolve(d.path, location.href) === resolve(file, docUrl.href))
    if (target) {
      a.setAttribute('href', '#' + target.id)
      a.addEventListener('click', e => { e.preventDefault(); navigate(target.id) })
    }
  })
}

async function navigate(id) {
  const doc = DOCS.find(d => d.id === id)
  if (!doc) return
  activeId = id
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === id)
  })
  const content = document.getElementById('content')
  try {
    const res = await fetch(doc.path, { cache: 'no-cache' })
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText)
    content.innerHTML = marked.parse(await res.text())
    fixLinks(content, doc)
  } catch (err) {
    content.innerHTML = '<p>Could not load <code>' + doc.path + '</code> (' + err.message +
      '). Serve this folder over HTTP — opening the file directly will not work.</p>'
  }
  content.scrollTop = 0
  history.replaceState(null, '', '#' + id)
}

function init() {
  buildSidebar()
  const hash = location.hash.slice(1)
  navigate(hash && DOCS.find(d => d.id === hash) ? hash : DOCS[0].id)
}

document.addEventListener('DOMContentLoaded', init)
</script>
</body>
</html>
