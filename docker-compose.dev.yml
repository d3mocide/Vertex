# Development override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Replaces the production nginx frontend with the Vite dev server so that
# source changes hot-reload in the browser without rebuilding the image.
# The Vite proxy config (vite.config.ts) handles /api, /ws, /stream/, /op25/.

services:
  frontend:
    build:
      context: ./frontend
      target: build
    # Override the nginx image entrypoint with the Vite dev server
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_STREAM_URL: ${VITE_STREAM_URL:-/stream/radio.mp3}
      VITE_RADAR_LAYER: ${VITE_RADAR_LAYER:-RTX-N0Q-0}
      VITE_OBSERVATION_RANGE_KM: ${VITE_OBSERVATION_RANGE_KM:-50}
      VITE_PROXY_ICECAST_TARGET: ${VITE_PROXY_ICECAST_TARGET:-http://icecast:8000/}
      VITE_PROXY_OP25_TARGET: ${VITE_PROXY_OP25_TARGET:-http://op25:8080/}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-80}:5173"
